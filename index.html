<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4E79">
<link rel="apple-touch-icon" href="icon.png">
<title>JOH Room Assistant</title>
<script src="vendor/pdf.min.js"></script>
<style>
:root{--navy:#1F4E79;--bg:#eef1f5;--card:#fff;--line:#dfe4ea;--txt:#1c2733;--mut:#6b7785;--acc:#0e7c66;--red:#e02424}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;overscroll-behavior:none}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:16px;font-weight:600}
header .sub{font-size:11px;opacity:.85}
#searchbar{display:flex;gap:6px;margin-top:8px}
#q{flex:1;padding:11px 12px;border:0;border-radius:8px;font-size:16px}
select{padding:8px;border:0;border-radius:8px;background:#fff;font-size:13px}
main{padding:10px;max-width:1000px;margin:0 auto}
.hint{color:var(--mut);font-size:12px;padding:6px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.roomrow{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer;padding:12px}
.roomrow:active{background:#eef3f9}
.rn{font-weight:700;color:var(--navy);white-space:nowrap}
.rt{flex:1;color:var(--txt);overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--mut)}
.badge{display:inline-block;background:var(--acc);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px}
h2{font-size:15px;color:var(--navy);margin:14px 0 6px;border-bottom:2px solid var(--navy);padding-bottom:3px}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
th{background:var(--navy);color:#fff;text-align:left;padding:6px}
td{padding:6px;border:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#f6f8fb}
.kv td:first-child{font-weight:600;width:38%;color:var(--navy)}
.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;margin:4px 4px 4px 0}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.small{font-size:12px;color:var(--mut)}
#pv{position:relative;overflow:hidden;height:62vh;background:#5b6470;border-radius:10px;border:1px solid var(--line);touch-action:none;user-select:none}
#pcv{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid var(--red);border-radius:50%;background:rgba(224,36,36,.18);box-shadow:0 0 0 2px rgba(255,255,255,.8);animation:pulse 1.4s infinite;pointer-events:none;z-index:4}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.45)}100%{transform:scale(1)}}
#pvctl{position:absolute;right:8px;bottom:8px;z-index:5;display:flex;gap:6px}
#pvctl button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#pvlvl{position:absolute;left:8px;top:8px;z-index:5;background:rgba(31,78,121,.9);color:#fff;padding:4px 10px;border-radius:8px;font-size:13px;font-weight:600}
#pvstat{position:absolute;left:8px;bottom:8px;z-index:5;background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:6px;font-size:11px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
details>summary{cursor:pointer;padding:12px 14px;font-weight:700;color:var(--navy);font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;background:#f4f7fb;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary .cnt{margin-left:auto;font-size:11px;color:var(--mut);font-weight:400}
details>summary:after{content:'▸';margin-left:8px;transition:transform .15s}
details[open]>summary:after{transform:rotate(90deg)}
details>.body{padding:10px 14px}
.lay{margin:4px 0;padding-left:18px;position:relative;font-size:13px}
.lay:before{content:'—';position:absolute;left:0;color:var(--acc)}
.tick{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.tick:last-child{border-bottom:0}
.tick input{width:20px;height:20px;margin-top:1px;accent-color:var(--acc);flex-shrink:0;cursor:pointer}
.tick .tt{flex:1}
.tick .ts{font-size:11.5px;color:var(--mut);display:block}
.tick.done .tt{text-decoration:line-through;color:var(--mut)}
.bar{height:9px;background:#e5e9ef;border-radius:5px;overflow:hidden;margin:3px 0 8px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar>i.warn{background:#d97706}.bar>i.bad{background:#dc2626}
.mat{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mchip{width:34px;height:34px;border-radius:6px;background:linear-gradient(135deg,#c9cfd8,#8d97a5);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:10px;flex-shrink:0;border:1px solid var(--line)}
.mat .mc{font-weight:700;color:var(--navy);font-size:12.5px}
.mat .md{font-size:12px;color:var(--txt)}
.mat .ms{font-size:11px;color:var(--mut)}
.sublab{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 3px}
/* ---- story board ---- */
.sb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;margin:6px 0}
.sb-card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sb-card:active{transform:scale(.97)}
.sb-sw{height:72px;display:flex;align-items:flex-end;justify-content:flex-start;padding:5px}
.sb-sw span{background:rgba(255,255,255,.92);color:#1c2733;font-weight:700;font-size:11px;padding:1px 6px;border-radius:6px}
.sb-sw.big{width:96px;height:96px;border-radius:12px;flex-shrink:0;align-items:flex-end}
.sb-sw.big span{font-size:15px;padding:3px 9px}
.sb-meta{padding:7px 8px}
.sb-name{font-size:11.5px;font-weight:600;color:var(--txt);line-height:1.2;min-height:26px;overflow:hidden}
.sb-cat{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.sb-hero{display:flex;gap:12px;align-items:center}
.sw{display:inline-block;min-width:44px;padding:6px 8px;border-radius:8px;color:#fff;font-weight:700;font-size:11px;margin:2px 4px 2px 0;cursor:pointer;text-align:center}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:#eef3f9;border:1px solid var(--line);color:var(--navy);border-radius:14px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer}
.chip:active{background:var(--navy);color:#fff}
.reflink{display:inline-block;margin:3px 8px 3px 0;color:var(--acc);font-weight:600;text-decoration:none;border-bottom:1px dashed var(--acc)}
.reflink:active{opacity:.7}
#doc{display:none}
@media print{body>*{display:none!important}#doc{display:block!important;color:#000}#doc h1{font-size:18px}#doc h2{font-size:14px;color:#000}#doc img{max-width:100%}#doc table{font-size:11px}}
</style>
</head>

function openNearestRoom(lvl,x,y){

  Object.keys(POS).forEach(function(k){var p=POS[k]; if(p[0]!==lvl)return;

/* ---------------- plan viewer (PDF.js crisp + PNG fallback) ---------------- */
var Viewer=(function(){
  var V={room:null,lvl:null,vw:1191,vh:842,viewScale:1,tx:0,ty:0,dpr:1,
         png:null,pngScale:3,pdfPage:null,pdfCanvas:null,pdfScale:0,
         container:null,cv:null,ctx:null,mk:null,stat:null,renderTimer:null,maxScale:4};
  var pdfCache={};

  function open(k,lv){
    V.room=k; V.lvl=lv;
    var dim=DIMS[lv]; V.pngScale=dim[0]/V.vw;
    V.dpr=window.devicePixelRatio||1;
    var p=POS[k]; V.mx=p[1]*V.vw; V.my=p[2]*V.vh;
    V.container=document.getElementById('pv');
    V.cv=document.getElementById('pcv'); V.ctx=V.cv.getContext('2d');
    V.mk=document.getElementById('mk'); V.stat=document.getElementById('pvstat');
    // safe canvas cap (iOS: ~4096px dim, ~14MP) 
    V.maxScale=Math.min(Math.sqrt(14.0e6/(V.vw*V.vh)), 4000/V.vw, 4000/V.vh);
    // load PNG base
    V.png=null;
    if(PNGSRC[lv]){var im=new Image(); im.onload=function(){V.png=im;V.pngScale=im.width/V.vw;draw();}; im.src=PNGSRC[lv];}
    bind();
    centerRoom();
    loadPdf();
  }
  function setStat(s){if(V.stat)V.stat.textContent=s;}

  /* load & cache pdf.js page */
  function loadPdf(){
    if(!(window.pdfjsLib)||!PDFSRC[V.lvl]){setStat('plan image');return;}
    setStat('loading PDF…');
    var lvl=V.lvl;
    var done=function(page){ if(lvl!==V.lvl)return; V.pdfPage=page; renderPdf(V.needScale(),function(){}); };
    if(pdfCache[lvl]){done(pdfCache[lvl]);return;}
    try{
      pdfjsLib.getDocument(PDFSRC[lvl]).promise.then(function(pdf){
        return pdf.getPage(1);
      }).then(function(page){ pdfCache[lvl]=page; done(page); })
       .catch(function(e){ setStat('plan image (PDF unavailable)'); });
    }catch(e){ setStat('plan image'); }
  }
  V.needScale=function(){
    var want=V.viewScale*V.dpr*1.15;
    return Math.min(Math.max(want,2),V.maxScale);
  };

  /* render full page to offscreen canvas at given px/vu */
  function renderPdf(scale,cb){
    if(!V.pdfPage){if(cb)cb();return;}
    scale=Math.min(scale,V.maxScale);
    if(V.pdfCanvas && Math.abs(V.pdfScale-scale)<0.05){if(cb)cb();return;}
    var vp=V.pdfPage.getViewport({scale:scale});
    var c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
    setStat('rendering…');
    V.pdfPage.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(function(){
      V.pdfCanvas=c; V.pdfScale=scale; setStat('PDF · crisp'); draw(); if(cb)cb();
    }).catch(function(){ setStat('plan image'); if(cb)cb(); });
  }

  function clampS(s){return Math.max(0.12,Math.min(V.maxScale*1.6,s));}
  function centerAt(s){
    V.viewScale=clampS(s);
    var cw=V.container.clientWidth,ch=V.container.clientHeight;
    V.tx=cw/2 - V.mx*V.viewScale; V.ty=ch/2 - V.my*V.viewScale;
    draw(); scheduleRender();
  }
  function fitPlan(){
    var cw=V.container.clientWidth,ch=V.container.clientHeight;
    V.viewScale=Math.min(cw/V.vw,ch/V.vh)*0.985;
    V.tx=(cw-V.vw*V.viewScale)/2; V.ty=(ch-V.vh*V.viewScale)/2;
    draw(); scheduleRender();
  }
  function zoomAt(px,py,ns){
    ns=clampS(ns); var f=ns/V.viewScale;
    V.tx=px-(px-V.tx)*f; V.ty=py-(py-V.ty)*f; V.viewScale=ns; draw(); scheduleRender();
  }
  function zoomBy(f){var cw=V.container.clientWidth,ch=V.container.clientHeight;zoomAt(cw/2,ch/2,V.viewScale*f);}
  function centerRoom(){centerAt(2.4);}
  function scheduleRender(){
    if(!V.pdfPage)return;
    clearTimeout(V.renderTimer);
    V.renderTimer=setTimeout(function(){renderPdf(V.needScale(),function(){});},160);
  }

  function draw(){
    if(!V.container)return;
    var cw=V.container.clientWidth,ch=V.container.clientHeight;
    if(V.cv.width!==Math.round(cw*V.dpr)||V.cv.height!==Math.round(ch*V.dpr)){
      V.cv.width=Math.round(cw*V.dpr); V.cv.height=Math.round(ch*V.dpr);
    }
    var ctx=V.ctx; ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
    ctx.fillStyle='#5b6470'; ctx.fillRect(0,0,cw,ch);
    // visible vu region
    var x0=-V.tx/V.viewScale, y0=-V.ty/V.viewScale,
        x1=(cw-V.tx)/V.viewScale, y1=(ch-V.ty)/V.viewScale;
    x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(V.vw,x1);y1=Math.min(V.vh,y1);
    if(x1>x0&&y1>y0){
      // pick source: pdf if crisp enough else png
      var src=null,sScale=0;
      if(V.pdfCanvas && V.pdfScale>=V.viewScale*V.dpr*0.85){src=V.pdfCanvas;sScale=V.pdfScale;}
      else if(V.png){src=V.png;sScale=V.pngScale;}
      else if(V.pdfCanvas){src=V.pdfCanvas;sScale=V.pdfScale;}
      if(src){
        var sx0=x0*sScale,sy0=y0*sScale,sw=(x1-x0)*sScale,sh=(y1-y0)*sScale;
        var dx0=x0*V.viewScale+V.tx,dy0=y0*V.viewScale+V.ty,dw=(x1-x0)*V.viewScale,dh=(y1-y0)*V.viewScale;
        ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
        try{ctx.drawImage(src,sx0,sy0,sw,sh,dx0,dy0,dw,dh);}catch(e){}
      }
    }
    // marker
    if(V.mk){V.mk.style.left=(V.mx*V.viewScale+V.tx)+'px';V.mk.style.top=(V.my*V.viewScale+V.ty)+'px';}
  }

  function bind(){
    var pv=V.container,pts=new Map(),lastDist=0,lastMid=null;
    var downX=0,downY=0,downT=0,moved=false,maxP=0;
    pv.onpointerdown=function(e){pv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      maxP=Math.max(maxP,pts.size);
      if(pts.size===1){downX=e.clientX;downY=e.clientY;downT=Date.now();moved=false;}
      if(pts.size===2){var a=[...pts.values()];lastDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);lastMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}};
    pv.onpointermove=function(e){
      if(!pts.has(e.pointerId))return;
      var prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(Math.hypot(e.clientX-downX,e.clientY-downY)>9)moved=true;
      var r=pv.getBoundingClientRect();
      if(pts.size===1){var dx=e.clientX-prev.x,dy=e.clientY-prev.y;V.tx+=dx;V.ty+=dy;draw();}
      else if(pts.size===2){
        var a=[...pts.values()];var dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);var mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
        if(lastDist){zoomAt(mid.x-r.left,mid.y-r.top,V.viewScale*(dist/lastDist));V.tx+=mid.x-lastMid.x;V.ty+=mid.y-lastMid.y;draw();}
        lastDist=dist;lastMid=mid;
      }
    };
    var up=function(e){
      var r=pv.getBoundingClientRect();
      var wasTap=(pts.size===1&&maxP===1&&!moved&&(Date.now()-downT)<500);
      var cx=e.clientX-r.left, cy=e.clientY-r.top;
      pts.delete(e.pointerId);lastDist=0;lastMid=null;scheduleRender();
      if(pts.size===0){maxP=0;moved=false;}
      if(wasTap&&window.openNearestRoom){
        var x=(cx-V.tx)/V.viewScale, y=(cy-V.ty)/V.viewScale;
        openNearestRoom(V.lvl,x,y);
      }
    };
    pv.onpointerup=up;pv.onpointercancel=up;
    pv.onwheel=function(e){e.preventDefault();var r=pv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,V.viewScale*(e.deltaY<0?1.15:0.87));};
  }

  return {open:open,zoomBy:zoomBy,fitPlan:fitPlan,centerRoom:centerRoom,draw:draw};
})();
function zoomBy(f){Viewer.zoomBy(f);}
function fitPlan(){Viewer.fitPlan();}
function centerRoom(){Viewer.centerRoom();}

function cropForPrint(k){
  var p=POS[k]; if(!p)return null; var lv=p[0];
  var src=PNGSRC[lv]; if(!src)return null;
  var dim=DIMS[lv]; var img=new Image(); img.src=src;
  var cw=1000, side=Math.min(dim[0],dim[1])*0.22;
  var sx=Math.max(0,p[1]*dim[0]-side/2), sy=Math.max(0,p[2]*dim[1]-side/2);
  try{
    var c=document.createElement('canvas');c.width=cw;c.height=cw;
    var ctx=c.getContext('2d');
    ctx.drawImage(img,sx,sy,side,side,0,0,cw,cw);
    var mx=(p[1]*dim[0]-sx)/side*cw, my=(p[2]*dim[1]-sy)/side*cw;
    ctx.strokeStyle='#e02424';ctx.lineWidth=8;ctx.beginPath();ctx.arc(mx,my,50,0,7);ctx.stroke();
    return c.toDataURL('image/png');
  }catch(e){return null;}
}

 'Wall':'Fix boards to metal studs; tape & fill joints to Level 4; prime; apply 2 finishing coats. Sample a 1m mock-up for colour/texture approval before bulk work.',
 'Wall (laminate)':'Substrate true & dry; balance rear face; bond laminate with contact/PVA adhesive; roll flat; trim & arris edges; seal cut edges.',
 'Floor':'Screed flat to SR2; apply membrane (wet areas, flood-test); flexible adhesive; lay to set-out with consistent joints; grout/seal; protect until handover.',
 'Skirting':'Scribe to floor line; fix per SK type (direct-stick / flush shadowline); align with wall finish; mitre external corners.',
 'Plumbing/Sanitary fixture':'Confirm first-fix outlets & pressure test; seal penetrations; bed fixture level; silicone all junctions; commission & test.',
 'Door/Window':'Check opening plumb/square to tolerance; fit frame; hang leaf; set ironmongery & seals; adjust self-closing; confirm fire/acoustic rating label.',
 'Glazing':'Measure opening; set with correct packers & bite; seal perimeter both faces; protect during following trades.',
 'Metal':'Degrease & prime substrate; fix with concealed brackets; apply finish system in controlled conditions; protect from site abrasion.',
 'Bespoke furniture':'Confirm site measure vs shop drawing; dry-fit; fix/level; connect services if applicable; protect & snag.',
 'Chair/FF&E':'Deliver & assemble per schedule; position per set-out; check fixings; inspect finish.',
 'Table/FF&E':'Deliver & assemble per schedule; position per set-out; level; inspect finish.',
 'Accessory':'Fix at scheduled height/location; confirm fixings suit substrate; align to datum lines.',
 'Hardware/LED':'Confirm driver/transformer location & access; test circuit; fit & aim; seal to required IP where applicable.'
};
function matApp(cat){return MAT_APP[cat]||'Install per manufacturer method statement & project specification; produce a sample/mock-up for sign-off first.';}

/* colour swatch tile for a code */
function swatchChip(code){
  var m=MATS[code]||{}; var col=m.col||'#8d97a5';
  return '<span class="sw" style="background:'+col+'" onclick="event.stopPropagation();openMaterial(\''+esc(code)+'\')" title="'+esc(m.name||code)+'">'+esc(code)+'</span>';
}

/* material story board for a room */
function renderMaterialBoard(k){
  var rf=RFIN[k]; var codes=[];
  if(rf){['wall','floor','skirt','ceil','door','fixture','ffe','accessory','hardware'].forEach(function(el){
    (rf[el]||[]).forEach(function(c){if(codes.indexOf(c)<0)codes.push(c);});});}
  if(!codes.length){var f=FIN[(ROOMS[k]||{}).abbr]; if(f&&f.materials){f.materials.forEach(function(m){if(m.code&&codes.indexOf(m.code)<0)codes.push(m.code);});}}
  if(!codes.length) return '';
  var h='<div class="sb-grid">';
  codes.slice(0,18).forEach(function(c){var m=MATS[c]||{};
    h+='<div class="sb-card" onclick="openMaterial(\''+esc(c)+'\')">'
      +'<div class="sb-sw" style="background:'+(m.col||'#8d97a5')+'"><span>'+esc(c)+'</span></div>'
      +'<div class="sb-meta"><div class="sb-name">'+esc(m.name||'')+'</div><div class="sb-cat">'+esc(m.cat||'')+'</div></div></div>';});
  h+='</div>';
  return h;
}

/* full material detail page */
function openMaterial(code){
  var m=MATS[code]||{code:code,cat:'',name:'',spec:'',rooms:[],col:'#8d97a5'};
  var h='<button class="btn ghost" onclick="search()">&larr; Back</button>';
  h+='<button class="btn" onclick="printMaterial(\''+esc(code)+'\')">Export</button>';
  h+='<div class="card sb-hero"><div class="sb-sw big" style="background:'+(m.col||'#8d97a5')+'"><span>'+esc(code)+'</span></div>'
    +'<div><div class="rn" style="font-size:22px">'+esc(code)+'</div>'
    +'<div style="font-size:16px">'+esc(m.name||'')+'</div>'
    +'<div class="small">'+esc(m.cat||'')+'</div></div></div>';
  if(m.spec&&m.spec!==m.name)h+='<div class="card"><div class="sublab">Specification</div><div>'+esc(m.spec)+'</div></div>';
  h+='<div class="card"><div class="sublab">Application method</div><div>'+esc(matApp(m.cat))+'</div></div>';
  var rooms=m.rooms||[];
  h+='<div class="card"><div class="sublab">Used in '+rooms.length+' room(s)</div>';
  if(rooms.length){h+='<div class="chipwrap">';
    rooms.slice(0,120).forEach(function(r){h+='<span class="chip" onclick="openRoom(\''+esc(r)+'\')">'+esc(r)+'</span>';});
    h+='</div>'; if(rooms.length>120)h+='<div class="small">+ '+(rooms.length-120)+' more</div>';
  }else{h+='<div class="small">No room tags associated on the extracted plans (appears on typical/overall sheets).</div>';}
  h+='</div>';
  h+='<div class="card small">Finish codes per project finishing drawings & schedules (DS-SCH-ID-000042). Colour chip is indicative of category, not the physical sample. Attach approved mock-up photos to this code in the site register.</div>';
  app.innerHTML=h; window.scrollTo(0,0);
}

/* references with offline PDF links */
function renderRefs(k,lv){
  var h='<div class="card small">';
  h+='<div class="sublab">Open offline (tap)</div>';
  h+='<a class="reflink" href="plans/'+lv+'.pdf" target="_blank">&#128441; Level '+esc(lv)+' architectural plan &mdash; '+esc(DWG[lv]||'')+'</a>';
  h+='<a class="reflink" href="refs/OPE_Toilets.pdf" target="_blank">&#128441; Finishing plan &mdash; OPE Toilets</a>';
  h+='<a class="reflink" href="refs/OPE_Overall_Ceiling.pdf" target="_blank">&#128441; Finishing plan &mdash; OPE Overall Ceiling</a>';
  h+='<div style="margin-top:6px">Room schedule: <b>JOH-HLA-S4-01-056-XXX-GN-CAL-AR-000020</b> Rev F00<br>'
    +'Finishes schedule: <b>DS-SCH-ID-000042</b> · Plumbing: <b>DS-SCH-ID-000040</b> · Loose furniture: <b>DS-SCH-ID-000041</b><br>'
    +'Model/key plan: JOH-HLA-S4-01-056-XXX-ZZ-M3-AR-019300';
  if(IDFREF[k])h+='<br>IDF detail crop: IDF_Crops/IDF_'+k.replace(/\./g,'_')+'_L'+esc(lv)+'.pdf';
  h+='</div>';
  return h;
}

/* material search results (called from renderList) */
function materialMatches(t){
  if(!t)return [];
  t=t.toUpperCase(); var out=[];
  Object.keys(MATS).forEach(function(c){
    var m=MATS[c]; var hay=(c+' '+(m.name||'')+' '+(m.cat||'')).toUpperCase();
    if(hay.indexOf(t)>=0)out.push(c);});
  return out;
}
function printMaterial(code){
  var m=MATS[code]||{code:code,name:'',cat:'',spec:'',rooms:[]};
  var h='<h1>Material: '+esc(code)+'</h1><div class="small">Jeddah Opera House &middot; Interior finishes</div>';
  h+='<table class="kv"><tr><td>Code</td><td>'+esc(code)+'</td></tr><tr><td>Category</td><td>'+esc(m.cat||'')+'</td></tr><tr><td>Description</td><td>'+esc(m.name||'')+'</td></tr><tr><td>Spec</td><td>'+esc(m.spec||'')+'</td></tr><tr><td>Application</td><td>'+esc(matApp(m.cat))+'</td></tr></table>';
  var rooms=m.rooms||[]; if(rooms.length){h+='<h2>Used in</h2><div class="small">'+esc(rooms.join(', '))+'</div>';}
  document.getElementById('doc').innerHTML=h; setTimeout(function(){window.print();},300);
}

q.addEventListener('input',search);
q.addEventListener('keydown',function(e){if(e.key==='Enter'){var t=q.value.trim();if(ROOMS[t])openRoom(t);}});
fl.addEventListener('change',search);
fa.addEventListener('change',search);
renderList([],'');
loadProgress();
if(location.hash){var k=decodeURIComponent(location.hash.slice(1));if(ROOMS[k])openRoom(k);}

</script>
